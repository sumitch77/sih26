<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Batch | SkillPortal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f3f5f9] text-[#122c52] font-sans min-h-screen flex flex-col">

  <!-- Top Navigation Header -->
  <header class="bg-[#122c52] border-b border-[#1c3a68] h-16 flex items-center justify-between px-6 sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-[#2f6fed] rounded-lg text-white font-bold text-xl flex items-center justify-center shadow">S</div>
      <div>
        <h1 class="text-white font-bold text-base leading-tight">SkillPortal</h1>
        <p class="text-[#aab1bf] text-xs">Training & Placement Engine</p>
      </div>
    </div>

    <div class="flex items-center gap-5">
      <div class="relative w-72">
        <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 stroke-[#aab1bf]" fill="none" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input type="text" placeholder="Search batches, schedules..." class="w-full bg-[#1c3a68] text-white text-sm rounded-lg pl-9 pr-4 py-2 placeholder-[#aab1bf] focus:outline-none focus:ring-2 focus:ring-[#2f6fed]">
      </div>

      <div class="flex items-center gap-3 pl-4 border-l border-[#1c3a68]">
        <div class="w-8 h-8 rounded-full bg-[#7c5cd6] text-white font-semibold text-sm flex items-center justify-center">AD</div>
        <div>
          <p class="text-white font-semibold text-xs leading-none">Admin User</p>
          <p class="text-[#aab1bf] text-xs mt-1">Super Admin</p>
        </div>
      </div>
    </div>
  </header>

  <!-- App Layout -->
  <div class="flex flex-1">
    <!-- Sidebar -->
    <aside class="w-64 bg-[#122c52] border-r border-[#1c3a68] p-4 text-white">
      <p class="text-[11px] font-bold text-[#aab1bf] uppercase tracking-wider mb-3 px-3">Core Modules</p>
      <nav class="space-y-1">
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#aab1bf] hover:bg-[#1c3a68] hover:text-white text-sm font-medium transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          Dashboard Overview
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-[#2f6fed] text-white text-sm font-medium shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          Add Batch
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#aab1bf] hover:bg-[#1c3a68] hover:text-white text-sm font-medium transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
          All Batches
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8 overflow-y-auto">
      <div class="flex justify-between items-start mb-6">
        <div>
          <div class="text-xs text-[#8992a3] mb-1">Batch Management / <span class="text-[#2f6fed] font-semibold">Add Batch</span></div>
          <h2 class="text-2xl font-extrabold text-[#122c52]">Add New Batch</h2>
          <p class="text-sm text-[#8992a3]">Schedule and configure a new training batch group.</p>
        </div>
        <button type="button" class="bg-white border border-[#e6e9f0] text-[#122c52] px-5 py-2 rounded-lg font-semibold text-sm hover:bg-slate-50 transition">Cancel</button>
      </div>

      <!-- BATCH DETAILS CARD FORM -->
      <div class="max-w-4xl bg-white border-2 border-[#1c3a68] rounded-2xl shadow-xl overflow-hidden">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-[#122c52] to-[#1c3a68] p-5 flex items-center gap-4 border-b-4 border-[#2f6fed]">
          <div class="w-11 h-11 rounded-xl bg-[#2f6fed]/20 border border-white/10 text-[#3b82f6] flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
          </div>
          <div>
            <h3 class="text-lg font-bold text-white">Batch Details</h3>
            <p class="text-xs text-[#aab1bf]">Fill out the training batch assignment information below.</p>
          </div>
        </div>

        <!-- Form Body -->
        <form class="p-7 bg-white">
          <div class="grid grid-cols-2 gap-6">
            
            <!-- Course Field -->
            <div class="flex flex-col gap-1.5 col-span-2">
              <label class="text-[11px] font-extrabold text-[#122c52] uppercase tracking-wider">
                Course <span class="text-red-500">*</span>
              </label>
              <select required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 text-sm text-[#122c52] focus:outline-none focus:bg-white focus:border-[#2f6fed] focus:ring-4 focus:ring-[#2f6fed]/20 transition">
                <option value="ds_ml" selected>Data Science & Machine Learning</option>
                <option value="web_dev">Full Stack Web Development</option>
                <option value="ai_eng">Artificial Intelligence Engineering</option>
                <option value="cloud">Cloud Computing & DevOps</option>
              </select>
            </div>

            <!-- Provider Field -->
            <div class="flex flex-col gap-1.5 col-span-2 sm:col-span-1">
              <label class="text-[11px] font-extrabold text-[#122c52] uppercase tracking-wider">
                Provider <span class="text-red-500">*</span>
              </label>
              <select required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 text-sm text-[#122c52] focus:outline-none focus:bg-white focus:border-[#2f6fed] focus:ring-4 focus:ring-[#2f6fed]/20 transition">
                <option value="" disabled selected>Select Provider</option>
                <option value="nsdc">National Skill Academy</option>
                <option value="tech_corp">TechSkill Foundation</option>
                <option value="apex">Apex Learning Partners</option>
              </select>
            </div>

            <!-- Trainer Field -->
            <div class="flex flex-col gap-1.5 col-span-2 sm:col-span-1">
              <label class="text-[11px] font-extrabold text-[#122c52] uppercase tracking-wider">
                Trainer <span class="text-red-500">*</span>
              </label>
              <select required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 text-sm text-[#122c52] focus:outline-none focus:bg-white focus:border-[#2f6fed] focus:ring-4 focus:ring-[#2f6fed]/20 transition">
                <option value="" disabled selected>Select Lead Trainer</option>
                <option value="amit_verma">Amit Verma</option>
                <option value="priya_sharma">Priya Sharma</option>
                <option value="rajesh_kumar">Rajesh Kumar</option>
              </select>
            </div>

            <!-- District Field -->
            <div class="flex flex-col gap-1.5 col-span-2 sm:col-span-1">
              <label class="text-[11px] font-extrabold text-[#122c52] uppercase tracking-wider">
                District <span class="text-red-500">*</span>
              </label>
              <select required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 text-sm text-[#122c52] focus:outline-none focus:bg-white focus:border-[#2f6fed] focus:ring-4 focus:ring-[#2f6fed]/20 transition">
                <option value="" disabled selected>Select District</option>
                <option value="mumbai">Mumbai</option>
                <option value="delhi">Delhi</option>
                <option value="bengaluru">Bengaluru</option>
                <option value="pune">Pune</option>
              </select>
            </div>

            <!-- No. of Trainees Field -->
            <div class="flex flex-col gap-1.5 col-span-2 sm:col-span-1">
              <label class="text-[11px] font-extrabold text-[#122c52] uppercase tracking-wider">
                No. of Trainees <span class="text-red-500">*</span>
              </label>
              <input type="number" min="1" placeholder="e.g. 30" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 text-sm text-[#122c52] placeholder:text-slate-400 focus:outline-none focus:bg-white focus:border-[#2f6fed] focus:ring-4 focus:ring-[#2f6fed]/20 transition">
            </div>

            <!-- Start Date Field -->
            <div class="flex flex-col gap-1.5 col-span-2 sm:col-span-1">
              <label class="text-[11px] font-extrabold text-[#122c52] uppercase tracking-wider">
                Start Date <span class="text-red-500">*</span>
              </label>
              <input type="date" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 text-sm text-[#122c52] focus:outline-none focus:bg-white focus:border-[#2f6fed] focus:ring-4 focus:ring-[#2f6fed]/20 transition">
            </div>

            <!-- End Date Field -->
            <div class="flex flex-col gap-1.5 col-span-2 sm:col-span-1">
              <label class="text-[11px] font-extrabold text-[#122c52] uppercase tracking-wider">
                End Date <span class="text-red-500">*</span>
              </label>
              <input type="date" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 text-sm text-[#122c52] focus:outline-none focus:bg-white focus:border-[#2f6fed] focus:ring-4 focus:ring-[#2f6fed]/20 transition">
            </div>

          </div>

          <!-- Add Batch Action Button -->
          <div class="mt-7 pt-5 border-t border-slate-200 flex justify-end">
            <button type="submit" class="bg-gradient-to-r from-[#2f6fed] to-[#1c3a68] text-white font-bold text-sm px-8 py-3 rounded-xl shadow-lg hover:shadow-xl hover:-translate-y-0.5 active:translate-y-0 transition-all">
              Add Batch
            </button>
          </div>
        </form>

      </div>
    </main>
  </div>

</body>
</html>
